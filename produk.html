<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produk</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css" />
</head>

<body class="bg-gray-100 flex min-h-screen">
    <aside id="sidebar" class="w-64 shrink-0 bg-slate-900 text-white min-h-screen p-4 flex flex-col justify-between">
        <div>
            <div class="p-5 border-b border-slate-700">
                <h1 id="userName" class="text-2xl font-bold mr-auto">Streetwear</h1>
                <p id="userRole" class="text-xs text-slate-400">Admin Panel</p>
            </div>
            <p class="text-sm text-gray-400 pt-5 px-5 pb-5">Menu Utama</p>
            <nav class="flex flex-col px-3 space-y-1">
                <a class="flex items-center gap-3 hover:text-white hover:bg-blue-600 rounded-lg text-sm transition-colors  px-4 py-2.5"
                    href="dashboard.html">🏠<span>Dashboard</span></a>
                <a class="flex items-center gap-3 hover:text-white hover:bg-blue-600 rounded-lg text-sm transition-colors  px-4 py-2.5"
                    href="produk.html">📦<span>Produk</span></a>
                <a class="flex items-center gap-3 hover:text-white hover:bg-blue-600 rounded-lg text-sm transition-colors  px-4 py-2.5"
                    href="pesanan.html">🧾<span>Pesanan</span></a>
                <a class="flex items-center gap-3 hover:text-white hover:bg-blue-600 rounded-lg text-sm transition-colors  px-4 py-2.5"
                    href="pelanggan.html">👥<span>Pelanggan</span></a>
                <a class="flex items-center gap-3 hover:text-white hover:bg-blue-600 rounded-lg text-sm transition-colors  px-4 py-2.5"
                    href="kategori.html">🏷️<span>Kategori</span></a>
                <a class="flex items-center gap-3 hover:text-white hover:bg-blue-600 rounded-lg text-sm transition-colors  px-4 py-2.5"
                    href="laporan.html">📊<span>Laporan</span></a>
                <a class="flex items-center gap-3 hover:text-white hover:bg-blue-600 rounded-lg text-sm transition-colors  px-4 py-2.5"
                    href="pengaturan.html">⚙️<span>Pengaturan</span></a>
            </nav>
        </div>
    </aside>
    <div class="flex-1 flex flex-col">
        <header class="flex items-center justify-between px-6 py-4 bg-white border-b border-gray-100 ">
            <div>
                <h1 class="font-bold text-base text-gray-800">Admin Panel</h1>
            </div>
            <div class="flex items-center gap-3">
                <div class="text-right">
                    <h1 class="text-sm font-semibold text-gray-800 leading-tight">Admin</h1>
                    <p class="text-[11px] text-gray-400">Administrator</p>
                </div>
                <div
                    class=" w-9 h-9 rounded-full text-white bg-blue-600 font-medium text-sm flex items-center justify-center">
                    A
                </div>
            </div>
        </header>
        <main class="flex-1 p-6 space-y-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-700">Produk</h1>
                <p class="text-gray-600">Kelola produk yang tersedia di toko Anda.</p>
            </div>

            <div class=" bg-white rounded-lg shadow-sm border border-gray-100 p-6">
                <h2 class="text-2xl mb-5  font-bold text-gray-700">Tambahkan Produk</h2>
                <form id="formproduk" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

                        <div>
                            <label class="block text-lg font-medium text-gray-700 mb-1.5">Id Produk</label>
                            <input type="number" placeholder="Id Produk" id="id" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>

                        <div>
                            <label class="block text-lg font-medium text-gray-700 mb-2">Masukkan Nama Produk</label>
                            <input type="text" placeholder="Nama Produk" id="nama" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>

                        <div>
                            <label class="block text-lg font-medium text-gray-700 mb-2">Masukkan Harga Produk</label>
                            <input type="number" placeholder="Harga Produk" id="harga" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>

                        <div>
                            <label class="block text-lg font-medium text-gray-700 mb-2">Masukkan Stok Produk</label>
                            <input type="number" placeholder="Stok Produk" id="stok" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>

                        <div>
                            <label class="block text-lg font-medium text-gray-700 mb-2">Masukkan Kategori Produk</label>
                            <select id="kategori" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="">Pilih Kategori</option>
                                <option value="Jaket">Jaket</option>
                                <option value="Sepatu">Sepatu</option>
                                <option value="Celana">Celana</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <button type="submit" class="mt-4 px-12.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl">Tambahkan Produk</button>
                    </div>
                </form>
            </div>
    
    <section>
        <h2 class="text-2xl font-bold text-gray-700 mb-4">Daftar Produk</h2>

        <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-6">

            <table class="w-full">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nama Produk</th>
                        <th>Harga</th>
                        <th>Stok</th>
                        <th>Kategori</th>
                        <th>Status666</th>
                        <th>Aksi</th>
                    </tr>
                </thead>

                <tbody id="tabelproduk">

                </tbody>
            </table>
        </div>
    </section>
    </main>
</div>
    <script src="js/produk.js"></script>
</body>

</html>
