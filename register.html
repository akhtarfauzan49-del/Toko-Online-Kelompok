<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen py-10">
    <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md mx-4 sm:mx-0">
        <div class="flex items-center justify-center gap-2 mb-6">
            <span class="bg-indigo-600 text-white p-3 rounded-xl">
                <i class="fa-solid fa-bag-shopping"></i>
            </span>
            <span class="text-2xl font-bold text-gray-900">
                Stree<span class="text-indigo-600">twear</span>
            </span>
        </div>
        <h2 class="text-2xl font-bold text-center mb-6">Buat Akun Baru</h2>
        <form id="registerForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Nama Lengkap</label>
                <input type="text" id="regName" placeholder="Masukkan nama lengkap" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                <input type="email" id="regEmail" placeholder="Masukkan email" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                <input type="password" id="regPassword" placeholder="Buat password" minlength="8" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Konfirmasi Password</label>
                <input type="password" id="regConfirmPassword" placeholder="Ulangi password" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <label class="flex items-start gap-2 text-sm text-gray-600">
                <input type="checkbox" required class="mt-1">
                <span>Saya menyetujui syarat dan ketentuan yang berlaku.</span>
            </label>
            <p id="regError" class="text-red-500 text-sm text-center"></p>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl">Daftar</button>
        </form>
        <p id="regError" class="text-center text-sm text-gray-600 mt-6">
            Sudah punya akun? <a href="login.html" class="text-indigo-600 font-semibold hover:underline">Masuk ke akun</a>
        </p>
    </div>
    <script src="js/database.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
