<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen py-10">
    <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md mx-4 sm:mx-0">
        <div class="flex items-center justify-center gap-2 mb-6">
            <span class="bg-indigo-600 text-white p-3 rounded-xl">
                <i class="fa-solid fa-bag-shopping"></i>
            </span>
            <span class="text-2xl font-bold text-gray-900">
                Stree<span class="text-indigo-600">twear</span>
            </span>
        </div>
        <h2 class="text-2xl font-bold text-center mb-6">Login</h2>
        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                <input type="email" id="loginEmail" placeholder="Masukkan email" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                <input type="password" id="loginPassword" placeholder="Masukkan password" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <label class="flex items-center text-sm text-gray-600">
                <input type="checkbox" id="rememberMe" class="mr-2">
                Ingat saya
            </label>
            <p id="loginError" class="text-red-500 text-sm text-center"></p>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl">Login</button>
        </form>
        <p class="text-center text-sm text-gray-600 mt-4">
            Belum punya akun? 
            <a href="register.html" class="text-indigo-600 hover:underline">Daftar</a>
        </p>
    </div>
    <script src="js/database.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
